name: Build Duo Open Find N6 patch p1

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Duo Open pinned source
        uses: actions/checkout@v4
        with:
          repository: marcoazeem/duo-open
          ref: 2008747ceaabc22da030e4d93430ee8ed4677a0c
          path: duo-open

      - name: Apply Find N6 stall-safety patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('duo-open/app/src/main/java/com/duoopen/overlay/FoldOverlayService.kt')
          s = p.read_text()
          old = 'dismiss(fadeMs = FADE_OUT_STALLED_MS)'
          if old not in s:
              raise SystemExit('stall dismiss target not found')
          s = s.replace(old, 'removeOverlay()', 1)
          old2 = '''        hinge.stop()\n        displayManager.unregisterDisplayListener(displayListener)\n        removeOverlay()'''
          new2 = '''        if (::hinge.isInitialized) hinge.stop()\n        if (::displayManager.isInitialized) {\n            runCatching { displayManager.unregisterDisplayListener(displayListener) }\n        }\n        removeOverlay()'''
          if old2 not in s:
              raise SystemExit('onDestroy target not found')
          s = s.replace(old2, new2, 1)
          old3 = '''        overlay = null\n        detach(view)'''
          new3 = '''        overlay = null\n        view.animate().cancel()\n        detach(view)'''
          if old3 not in s:
              raise SystemExit('removeOverlay target not found')
          s = s.replace(old3, new3, 1)
          p.write_text(s)

          g = Path('duo-open/app/build.gradle.kts')
          t = g.read_text()
          t = t.replace('versionCode = 1', 'versionCode = 2', 1)
          t = t.replace('versionName = "1.0.0"', 'versionName = "1.0.0-findn6-p1"', 1)
          g.write_text(t)
          PY

      - name: Save patch diff
        working-directory: duo-open
        run: git diff > ../FIND_N6_PATCH.diff

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build patched debug APK
        working-directory: duo-open
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Record source and APK hashes
        run: |
          printf '%s  %s\n' '2008747ceaabc22da030e4d93430ee8ed4677a0c' 'SOURCE_COMMIT' > BUILD_INFO.txt
          printf '%s\n' 'PATCH=findn6-p1: stalled overlay immediate removal + guarded onDestroy + cancel animation before detach' >> BUILD_INFO.txt
          sha256sum duo-open/app/build/outputs/apk/debug/app-debug.apk | tee -a BUILD_INFO.txt

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: DuoOpen-v1.0.0-findn6-p1
          path: |
            duo-open/app/build/outputs/apk/debug/app-debug.apk
            BUILD_INFO.txt
            FIND_N6_PATCH.diff
          if-no-files-found: error
          retention-days: 1

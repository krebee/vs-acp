name: Build Duo Open v1.0.0

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Duo Open pinned source
        uses: actions/checkout@v4
        with:
          repository: marcoazeem/duo-open
          ref: 2008747ceaabc22da030e4d93430ee8ed4677a0c
          path: duo-open

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK from source
        working-directory: duo-open
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Record source and APK hashes
        run: |
          printf '%s  %s\n' '2008747ceaabc22da030e4d93430ee8ed4677a0c' 'SOURCE_COMMIT' > BUILD_INFO.txt
          sha256sum duo-open/app/build/outputs/apk/debug/app-debug.apk | tee -a BUILD_INFO.txt

      - name: Upload independently built APK
        uses: actions/upload-artifact@v4
        with:
          name: DuoOpen-v1.0.0-chat-build
          path: |
            duo-open/app/build/outputs/apk/debug/app-debug.apk
            BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 1
